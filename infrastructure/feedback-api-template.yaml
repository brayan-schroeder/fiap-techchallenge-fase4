
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Feedback API - FIAP Tech Challenge Fase 4

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Description: Chave secreta para acesso à Feedback API

Globals:
  Function:
    Runtime: java21
    MemorySize: 1024
    Timeout: 30
    Architectures:
      - x86_64

Resources:
  FeedbackApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fiap-feedback-api
      PackageType: Zip
      CodeUri: ../feedback-api/
      Handler: br.com.fiap.feedback.StreamLambdaHandler
      Role: arn:aws:iam::263429642056:role/fiap-feedback-api-execution-role
      Environment:
        Variables:
          TABLE_NAME: fiap-feedbacks
          API_KEY: !Ref ApiKey
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
  FeedbackApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fiap-feedback-api-5xx-errors
      AlarmDescription: Detecta erros 5xx na Feedback API
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: ns7thjib48
        - Name: Stage
          Value: '$default'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - arn:aws:sns:us-east-2:263429642056:fiap-feedback-api-alerts

Outputs:
  FeedbackApiUrl:
    Description: URL da Feedback API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
