
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Feedback API - FIAP Tech Challenge Fase 4

Globals:
  Function:
    Runtime: java21
    MemorySize: 1024
    Timeout: 30
    Architectures:
      - x86_64

Resources:
  FeedbackApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fiap-feedback-api
      PackageType: Zip
      CodeUri: ../feedback-api/
      Handler: br.com.fiap.feedback.StreamLambdaHandler
      Environment:
        Variables:
          TABLE_NAME: fiap-feedbacks
      Policies:
        - DynamoDBCrudPolicy:
            TableName: fiap-feedbacks
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

Outputs:
  FeedbackApiUrl:
    Description: URL da Feedback API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
