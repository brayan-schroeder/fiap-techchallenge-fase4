
name: Deploy AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Feedback API
      - name: Build Feedback API
        run: |
          cd feedback-api
          mvn clean package -e
          cd ..
          sam build \
            --template-file infrastructure/feedback-api-template.yaml \
            --build-dir .aws-sam/build-feedback-api

      - name: Deploy Feedback API
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          sam deploy \
            --template-file .aws-sam/build-feedback-api/template.yaml \
            --stack-name fiap-techchallenge-fase4-feedback-api \
            --region us-east-2 \
            --s3-bucket fiap-techchallenge-artifacts-263429642056-us-east-2 \
            --parameter-overrides "ApiKey=$API_KEY" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # Critical Notification Lambda
      - name: Build Notification Function
        run: |
          sam build \
            --template-file infrastructure/template.yaml \
            --build-dir .aws-sam/build-notification

      - name: Deploy Notification Function
        run: |
          sam deploy \
            --template-file .aws-sam/build-notification/template.yaml \
            --stack-name fiap-techchallenge-fase4-notification \
            --region us-east-2 \
            --s3-bucket fiap-techchallenge-artifacts-263429642056-us-east-2 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # Weekly Report Lambda
      - name: Build Weekly Report Function
        run: |
          sam build \
            --template-file infrastructure/weekly-report-template.yaml \
            --build-dir .aws-sam/build-weekly-report

      - name: Deploy Weekly Report Function
        run: |
          sam deploy \
            --template-file .aws-sam/build-weekly-report/template.yaml \
            --stack-name fiap-techchallenge-fase4-weekly-report \
            --region us-east-2 \
            --s3-bucket fiap-techchallenge-artifacts-263429642056-us-east-2 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
